# 由 scripts/export_from_usd.py 從 kros_car_new.usd **按下 Play 之後**的 stage 匯出, --exclude grap,mesh_3
# (visual mesh 的凸包頂點)。兩件事都是 2026-10-30 在 Isaac 斜拍畫面上對 YOLO 量出來的:
#   * 要在 Play 之後匯出: 手臂會被關節驅動到 arm_1 1.05 / arm_2 3.14 rad, 往前伸到 x=+0.367 m
#     (編輯姿勢只到 +0.195)。
#   * 要排除夾爪 (grap*) 與車頂 LiDAR 圓盤 (base_link/visuals/mesh_3): YOLO 的框不含它們。
#   scripts/fit_car_model.py 對 4192 個 YOLO 框 (8 台相機, 一段 120 s 的 8 字形) 的結果,
#   後半段多相機反推位置 vs GT:
#     整台車 (含夾爪、LiDAR)   常數偏移 (-4.60, -1.15) cm, RMS 4.96 cm
#     排除夾爪                 常數偏移 (-0.48, -1.14) cm, RMS 1.74 cm
#     排除夾爪 + LiDAR (這個)  常數偏移 (-0.15, -0.90) cm, RMS 1.38 cm
#   edge_bias_px 量到 [2.6, 3.2, -1.5, -2.9], 但加了 RMS 沒變 (1.39), 所以先不加。
# 座標是 base_link (m), x = 車頭, z = 上。手臂姿勢 / 外形改了就重跑。
# 外形範圍 x -0.194~+0.245, y -0.165~+0.165, z -0.042~+0.222 m (384388 個 mesh 頂點 -> 244 個凸包點)
# 排除的零件 (prim 路徑含這些字): grap, mesh_3
#
# base_z = base_link 原點離地面多高。這裡用「最低的頂點貼地」算 (= 輪子底);
# 車子停在平地上時就是這個值。地板不在 z=0 的話要自己加上地板高度。
base_z: 0.0416
# YOLO 的框 - 外形的外接框, 每個邊 [u1, v1, u2, v2] 的平均差 (px)。
# 量法: scripts/record_bbox.py 錄一段, 再 scripts/fit_car_model.py。
edge_bias_px: [0.0, 0.0, 0.0, 0.0]
# 讀進來之後整個外形平移多少 (base_link, m), points 與 box 都會套用。
# 車停著的時候, 多相機定位系統性地落在 base_link **前方約 1 cm** (LiDAR 沒有):
#   2026-11-02 兩輪 +0.96 / +0.95 cm, 2026-11-03 (相機時鐘已修好) +1.12 cm
# 外形往前移 1 cm 抵掉。用 11-03 那一輪重放 (car_loc_fusion/test/replay_all_sensors.py):
#   中位 1.22 -> 0.90 cm, 停車 1.11 -> 0.66, v>0.3 p95 1.97 -> 1.42, NEES 3.6 -> 1.5 (理想 ~1.4)
#   代價: 整體 p95 3.47 -> 3.91 —— 全部在慢速轉彎, 那是另一個還沒找到原因的誤差
#   (這 1 cm 只是剛好把它蓋住)。往後移 1 cm 則每一項都變差 (NEES 8.4)。
# 換車 / 改手臂姿勢 / 換 YOLO 模型就要重量。
points_shift: [0.01, 0.0, 0.0]
# 沒有 points 時的備案: 一個長方體 (min / max 兩個角)
box:
  min: [-0.1940, -0.1653, -0.0416]
  max: [0.2452, 0.1653, 0.2215]
