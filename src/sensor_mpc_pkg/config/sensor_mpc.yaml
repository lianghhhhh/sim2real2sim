# sensor_mpc_pkg 的節點參數 (模擬預設值)。launch 會疊上 topic / use_sim_time 等參數。
# MPC 本身的參數 (N_steps, dt, v_max, 權重, 模型檔) 在 model/mpc_config.json, 跟
# mlp_control_pkg 共用 —— 模擬跟實體車要用同一份, 比較才公平。
#
# 實體車要改的: odom_topic 不變 (/fusion_loc/odom), joint_states_topic:=/wheel_feedback,
# gt_topic:='' (沒有 GT), use_sim_time:=false。

path_tracker:
  ros__parameters:
    odom_topic: /fusion_loc/odom
    output_topic: /sensor_mpc/nearest_points
    frame_id: map
    loop: true                  # kros_car_mpc.usd 的路線是封閉的
    direction: auto             # auto | forward | backward
    n_targets: 10
    spacing: 0.1                # m, 要跟 mpc_config.json 的 path_point_spacing 一樣
    search_radius: 20
    far_threshold: 1.5          # m, 離路徑超過這麼遠走回歸曲線 (temp_curve 的 FAR_THRESHOLD)
    goal_tolerance: 0.15        # m, 不封閉路徑離終點這麼近算到了
    rate: 50.0                  # Hz
    pose_timeout: 0.5

sensor_state_node:
  ros__parameters:
    odom_topic: /fusion_loc/odom
    joint_states_topic: /joint_states     # 實體車 /wheel_feedback
    abs_age_topic: ''                     # 空 = /fusion_loc/abs_age
    gt_topic: /odom                       # 模擬: Isaac GT, 只記錄不控制; 實體車給 ''
    velocity_source: twist                # twist | diff
    vy_source: zero                       # zero | diff
    diff_alpha: 0.4
    pose_timeout: 0.3                     # s
    wheel_timeout: 0.3                    # s
    pose_sigma_max: 0.3                   # m; 0 = 不檢查
    abs_age_max: 1.0                      # s; 0 = 不檢查
    # 位姿延遲補償: none | stamp (用訊息時戳量到的延遲 + extra) | fixed (只有 extra)。
    # 先跑一輪看 CSV 的 pose_age 欄再決定; 相機時戳的問題應該用融合的 bbox_extra_delay 補。
    pose_lead_mode: none
    pose_lead_extra: 0.0                  # s
    pose_lead_max: 0.5                    # s

sensor_mpc_node:
  ros__parameters:
    mpc_config: ''                        # 空 = 環境變數 MPC_CONFIG_PATH
    path_topic: /sensor_mpc/nearest_points
    path_heading_relative: false          # true 只在吃 Isaac 的 /nearest_curve_point 時
    finished_topic: /sensor_mpc/finished
    joint_command_topic: /joint_command
    output_csv: /workspaces/car_run_data/sensor_mpc_tracking.csv
    rpm_step: 1.0                         # 輪速量化成整數 rpm; 0 = 不量化
    path_timeout: 0.5
    # 圍籬 (map 座標, m): 出了矩形、進了圓、或 MPC 預測 geofence_horizon 秒內會出去 -> 送 0 並鎖住,
    # ros2 service call /sensor_mpc_node/release_geofence std_srvs/srv/Trigger 才解除。
    # 這裡是 kros_car_mpc_sensor.usd 的房間 (牆內側 ±4.93 x ±3.39 縮 0.4 m, 圓柱 r 0.5 外擴 0.4);
    # launch 參數同名可以蓋掉。**實體場地一定要改。**
    geofence_x_min: -4.5
    geofence_x_max: 4.5
    geofence_y_min: -3.0
    geofence_y_max: 3.0
    geofence_circles: [2.10, -2.04, 0.9]
    geofence_horizon: 0.5
    # offset-free MPC (disturbance.py): 每個週期比較模型預測與實際, 低通後當成擾動加進預測。
    # 修模型與車子不合造成的穩態偏差; 沒有不合時不影響 (test/test_offset_free.py)。
    disturbance_enabled: true
    disturbance_tau: 1.0                  # s
    disturbance_limit: [0.2, 0.1, 0.1]    # 上限 (前進 m/s, 左側 m/s, yaw rate rad/s)
