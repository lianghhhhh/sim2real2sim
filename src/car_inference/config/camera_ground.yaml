# 天花板相機 -> Isaac 世界座標 的地面投影校正
#
# 由 scripts/calibrate_camera_ground.py 自動產生, 不要手改。
#   資料: car_run_data/sim_data.csv  n=1072  模型: homography
#   全資料殘差 RMSE 0.0726 m (p95 0.1546)
#
# 模型: 像素 -> (徑向去畸變) -> 單應性 -> 世界 (x, y)
#   d  = ([px, py] - center_px) / norm_scale
#   d' = d * (1 + k1*|d|^2 + k2*|d|^4)
#   [Xw, Yw, w] = H @ [d'x, d'y, 1];  (X, Y) = (Xw/w, Yw/w)
#
# 單應性是針孔相機看一個平面的精確模型。把它擬合到「車身高度那個平面」,
# 會一併吸收掉視差 (相機 z=2.7, bbox 中心是車身 z≈0.10)、相機傾斜、
# 主點偏移與安裝旋轉。
#
# 相機位置/朝向、render 解析度、車高、YOLO 模型任一改變 -> 重跑校正腳本。

image_width: 1920
image_height: 1536

center_px: [960.0, 768.0]
norm_scale: 1000.0

distortion: [0.000000, 0.000000]

homography:
  - [-5.225384, -0.012379, -0.016942]
  - [ 0.004277,  5.211111, -0.016666]
  - [-0.019646, -0.017937,  1.000000]
