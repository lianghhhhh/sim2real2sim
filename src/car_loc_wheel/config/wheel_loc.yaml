# IMU + 四輪輪速航位推算的節點參數。
# 每一個數字都是從 car_run_data/sim_data.csv 量出來的, 不是猜的 ——
#   python3 test/replay_csv.py <csv> --measure
wheel_localizer:
  ros__parameters:
    imu_topic: /imu
    joint_states_topic: /joint_states
    map_frame: map
    base_frame: base_link
    publish_tf: true

    # --- 車體 -----------------------------------------------------------------
    wheel_names: [front_left_joint, front_right_joint,
                  rear_left_joint, rear_right_joint]
    # 順序必須是 [FL, FR, RL, RR] —— 打滑偵測靠「同側前後輪」配對, 配錯對就失效。

    wheel_radius: 0.075        # car.usd: cylinder radius 0.5 * scale 0.15
    # v_true = wheel_scale * wheel_radius * omega。
    # 尺度誤差是**系統性**的 (走 100 m 就是幾公尺, 停車不會讓它消失)。
    # **它跟牽引狀態有關, 不是一個幾何常數。** 同一台車量出來:
    #   sim_data Reposition (控制器驅動)  n= 923  0.932  殘差 std 0.060
    #   sim_data 嚴格直線   (控制器驅動)  n= 863  0.929  殘差 std 0.086
    #   sim_data.backup     (控制器驅動)  n=1966  0.927  殘差 std 0.095
    #   spin12 (自旋後的**滑行**, 沒扭矩)  n= 312  1.008  殘差 std 0.0097
    # 四份有扭矩的都是 0.93, 只有滑行那份是 1.008 (= 幾何值)。這就是物理:
    # 有驅動力 -> 輪胎一定有縱向滑移 -> 輪子比車快 -> 有效半徑比幾何值小。
    # 定位時車子是被開著的, 所以用有扭矩的那個工作點。
    # 端到端 (214 秒那一輪): 1.0 -> RMS 0.74, 0.976 -> 0.72, 0.93 -> 0.68。
    # 要自己校就錄一段**正常開的直線** (不是滑行、不是自旋) 再量
    # (replay_bag.py --measure), 而且要 n > 200 且殘差 std < 0.03 才算數。
    wheel_scale: 0.93

    # base_link 的 +X 量到「車頭」的角度 (度)。**這台車不是 0。**
    # car.usd 的 base_link 是 +X 朝左、車頭 -Y (car_teleop/cmd_vel_bridge.py
    # 裡也寫著同一件事), 所以是 -90。
    # sim_data.csv 的佐證: 車子在動的時候 atan2(dy, dx) - gt_yaw 的中位數
    # = -90.0° (n=1718)。REP-103 的車給 0。
    # 給錯的話車子會往垂直於實際行進的方向跑 —— 這個 package 裡「側向速度 = 0」
    # 是寫進狀態的結構性假設, 軸給錯等於整台車的運動學都錯了。
    forward_deg: -90.0

    # --- 重力 / yaw 的來源 ----------------------------------------------------
    # 傾斜 1 度 = 0.17 m/s^2 的假加速度。加了輪速之後這件事沒有純 IMU 那麼致命
    # (輪速會把速度拉回來), 但傾角誤差還是會透過 b_a 影響打滑偵測的靈敏度。
    #   orientation   : 用訊息裡的 orientation (Isaac / 9 軸 IMU) <- 模擬用這個
    #   complementary : 陀螺儀積分 + 靜止時用加速度校正 (真車的 6 軸 IMU)
    #   none          : 假設車身永遠水平
    gravity_mode: orientation
    yaw_source: imu_orientation      # 真車的 6 軸 IMU 改成 gyro
    imu_yaw_sigma: 0.02
    tilt_alpha: 0.02

    # 航位推算不知道自己在世界的哪裡, 只能從一個給定的起點開始推。
    initial_pose: [0.0, 0.0, 0.0]
    initial_yaw_from_imu: true

    # 開機靜止校正。有輪速之後這一步變容易了 —— 「輪子不轉」就是靜止, 不用像
    # 純 IMU 那樣靠加速度變異數去猜。
    # 車子一開始就在動的話零偏沒人修, 而 yaw 零偏 × 行走距離就是位置誤差。
    calib_time: 1.0
    calib_timeout: 10.0

    # --- 靜止偵測 -------------------------------------------------------------
    # 實測 (sim_data.csv 4557 筆): 靜止時各輪 |w| 的 p95 = 0.062 rad/s。
    # 0.5 是那個雜訊底線的 8 倍, 而「四輪都低於 0.5 但車子其實在動 (>0.1 m/s)」
    # 的比例是 **0.00%** (門檻放到 2.0 才開始有 0.48%)。
    # 對照純慣性的靜止偵測: 它分不出「靜止」與「等速直線」, 只能靠加速度變異數
    # 去猜, 太鬆會在直線行駛時誤觸發 ZUPT 讓位置停住。輪速沒有這個問題。
    still_wheel: 0.5           # rad/s, 四顆輪子都要低於這個
    still_gyro: 0.05           # rad/s, 排除原地打轉
    still_window: 0.15

    # --- 濾波器 ---------------------------------------------------------------
    sigma_gyro: 0.02
    sigma_gyro_scale: 0.01     # 陀螺儀比例因子誤差; 轉得越快這一項越大
    # 加速度過程雜訊 = sqrt(sigma_acc^2 + (sigma_acc_omega*|w|)^2)。
    # **一定要有 w 那一項** —— 實測 (car_loc_imu 的 spin12 bag) IMU 扣完重力的
    # 水平加速度殘差: |w|<0.2 時 0.064 m/s^2, |w|>12 時 14.7, 差 230 倍。
    # 給常數的話直線行駛時 P 被灌大 (輪速更新的增益逼近 1, 一次就把位置搬走),
    # 高速自旋時 P 又太小 (正確的輪速被卡方閘門擋掉)。兩頭都錯。
    sigma_acc: 0.05
    sigma_acc_omega: 0.15
    # 側向過程雜訊。狀態裡沒有側向速度 (NHC 是結構性的), 但它不是完美的:
    # 實測乾淨行駛段側向速度 p95 只有 0.0006 m/s, 高速自旋 (|wz|>3) 時 0.097 m/s。
    # 給 0 的話 P 在側向是奇異的, 之後任何量測都修不動那一維。
    sigma_cross: 0.02
    sigma_bg: 1.0e-4
    sigma_ba: 1.0e-3
    # 線上估輪速尺度。**預設 0 = 凍結。** 可觀測性的問題: 要把尺度 k 跟加速度計
    # 零偏 b_a 分開, 需要「加速度計看得到、但尺度誤差解釋不了」的運動。走走停停
    # 的一般行駛裡兩者幾乎共線, 打開之後 k 會去吸收 b_a 的誤差, 反而更糟。
    # 離線量一次 (replay_csv.py --measure), 當常數用。
    sigma_k: 0.0

    # 輪速量測雜訊。實測乾淨行駛段殘差 std = 0.065 m/s, 但那裡面也包含 ground
    # truth 用 20 Hz 位置微分帶進來的雜訊, 所以 0.07 是偏保守的。
    wheel_sigma: 0.07
    # 嚴重打滑時放大到這個。**要給得很大。** 三份真實資料一起掃 (位置 RMS):
    #   sigma_slip   0.5    1.5    2.5    4.0    6.0   10.0   20.0
    #   sim_data   0.481  0.684  0.505  0.432  0.401  0.380  0.402
    #   backup     8.234  7.408  6.955  6.649  6.498  6.381  6.114
    #   spin12     6.290  6.184  5.784  5.480  5.302  5.163  5.122
    # 三份都是越大越好, 而原本的 1.5 剛好卡在**最差**的位置 —— 非單調正是
    # 「信一半」最糟的症狀: 量測爛到會把狀態拉走, sigma 又沒大到讓增益趨近 0。
    # 給 10 之後增益 ~1e-4, 效果等於丟掉, 但卡方閘門還看得到它 (逃生口
    # wheel_reject_time 要靠那個訊號)。合成資料上的代價: RMS 0.0243 -> 0.0255。
    wheel_sigma_slip: 10.0

    # 打滑指標 = **同側前後輪的轉速差**。同一側前後輪沒有差速器, 幾何上必須同速;
    # 不同速就是有一顆在滑 —— 這是輪速資料自己內部的矛盾, 不需要 ground truth
    # 也不需要濾波器狀態。實測輪速誤差 p95:
    #   <0.5 rad/s -> 0.12 m/s | 0.5-2 -> 0.18 | 2-5 -> 0.28 | >5 -> **3.84**
    # 在 [slip_spread, slip_spread_max] 之間線性放大 R, 不要二元地丟掉 ——
    # 輕微打滑的量測仍然比沒有好。
    slip_spread: 2.0
    slip_spread_max: 8.0

    # 輪速連續被卡方閘門擋掉超過這麼久 (秒) 就強制接受一次 (R 放大 3 倍)。
    # **這是逃生口, 不是保險。** ZUPT 之後 P[v] 被壓到 zupt_sigma^2 (1e-4), 之後
    # 只靠過程雜訊 qa*dt 慢慢長回來 (60 Hz 每步 4e-5)。所以濾波器的速度信念一旦
    # 錯得夠遠 —— 加速度計壞掉、gravity_mode 配錯、傾角估歪、或一段打滑之後輪子
    # 重新咬地 —— 閘門會**一直**擋: 要等 P[v] 長到蓋得住那個 innovation 才放行,
    # 實測 0.5 m/s 的落差要等 14 秒, 那段時間車子在估計裡停在原地不動。
    # 「連續擋掉這麼久」本身就是證據: 一次是量測的問題, 連續兩秒都對不上就是
    # 濾波器自己錯了。
    # **門檻要給得長。** 打滑期間卡方閘門本來就應該一直擋, 那不是病態 ——
    # 實測 0.33 秒的門檻會在打滑中介入, 位置 RMS 從 0.114 掉到 0.304 m;
    # 2 秒撐得過任何一次打滑, 又遠短於「等 P[v] 自己長回來」的 14 秒。
    # 0 = 不設逃生口。
    wheel_reject_time: 2.0

    zupt_sigma: 0.01
    zaru_sigma: 0.002
    # 靜止時的「零加速度」更新最多容忍多大的殘差 (m/s^2)。
    # **這個上限不是保險, 是前提檢查。** 加速度是速度的導數, 所以起步瞬間加速度
    # 已經滿了、輪子才剛要轉 —— 輪速的靜止偵測有先天的半拍延遲, 那一兩筆會把
    # 真實的加速度當成零偏吃進去。實測 (test_wheel_ins.py, 真實零偏 0.02):
    #   沒有上限 -> b_a 收到 0.0301, 位置 RMS 0.912 m
    #   有上限   -> b_a 收到 0.0203, 位置 RMS 0.268 m
    zero_accel_sigma: 0.05
    zero_accel_max: 0.5

    anchor_sigma: 0.02
    anchor_after: 0.5
    v_max: 4.0
    # 單次更新最多能把位置搬多少 (m)。速度量測透過 P 的位置-速度相關項改到位置,
    # P 一大就會一次搬走好幾公尺, 而卡方閘門擋不住 (P 大 S 也大, NIS 反而小)。
    max_pos_correction: 0.5

    enable_wheel: true         # false = 退化成純 IMU (只拿來做 A/B)
    enable_zupt: true
    enable_zaru: true
    enable_anchor: true
    enable_slip_gate: true

    wheel_timeout: 0.5         # 這麼久沒有輪速就警告 (等於退回純 IMU)
    status_period: 2.0
