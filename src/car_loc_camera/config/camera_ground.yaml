# 天花板相機 -> 世界座標 的地面投影校正 (方法一專用)
#
# 模型: 像素 -> (徑向去畸變) -> 單應性 -> 世界 (x, y)
#   d  = ([px, py] - center_px) / norm_scale
#   d' = d * (1 + k1*|d|^2 + k2*|d|^4)
#   [Xw, Yw, w] = H @ [d'x, d'y, 1];  (x, y) = (Xw/w, Yw/w)
#
# 2026-09-09 重新擬合。指令 (n=4262, conf>=0.5 且去掉像素重複列):
#   python3 -m car_cam_calib.fit_csv car_run_data/sim_data.csv -o <out>.yaml
#   (!! car_cam_calib 已經刪掉, 而且從來沒進過 git —— 這個指令現在跑不起來,
#    下面的數字是當時的紀錄。要重新擬合得另外寫擬合腳本, 輸入是 CSV 的
#    cam_ 欄位不夠, 需要 /camera_loc/detection_px 的原始像素。)
# 5-fold 交叉驗證 (二維誤差量值) RMSE 2.17 cm, 中位數 0.54 cm, p95 3.99 cm。
# 相機位置/朝向、render 解析度、車高、YOLO 模型任一改變就要重新擬合。
#
# *** 這次改動推翻了舊註解「0.0726 就是方法一的精度上限」。***
# 舊的 0.0726 裡絕大部分不是校正誤差, 是**沒填的 delay**: 把誤差對世界座標
# 速度回歸 e = bias - tau*v, 誤差向量與 -v 的夾角 cos = 0.993 —— 幾乎是純延遲。
# 拿 car_run_data/sim_data.csv 的原始 yolo_px 離線重跑真正的 ConstVelTracker,
# 依影像時刻對齊 GT (n=4302):
#                        RMS     中位數    p95    靜止    spd>1   距中心>2.5m
#   舊設定 (delay=0)    8.58 cm  2.81   14.73    3.16   25.15     8.30
#   這一版              2.12 cm  0.54    3.74    0.51    6.48     1.80
# 所以「換更大的 YOLO 也不會變好」那句是對的, 但原因不是校正模型到頂,
# 而是誤差根本不在偵測也不在投影, 在時間軸上。
#
# 分析這份資料時有兩個會直接得到錯誤結論的坑:
#  1) 速度要用 GT 位置微分, 或把 /odom 的 twist 從 body frame 轉出來。Isaac 的
#     twist 是車體座標, 而且這台車 base_link 的前方是 **-y 不是 x** ——
#     直接拿 car_linear_velocity_x 當前進速度會回歸出 tau ~= 0 的假結論。
#  2) 見下面 delay 的時間基準說明。

image_width: 1920
image_height: 1536

center_px: [960.0, 768.0]
norm_scale: 1000.0

# 2026-09-09 擬合出來的 (舊值是 [0, 0], 那是「沒擬合過」不是「量出來是 0」)。
# 效果主要在畫面邊緣: 距相機中心 >2.5 m 的殘差 RMS 8.30 -> 1.80 cm。
# 注意 fit_csv 報「+delay 之後再加 distortion 沒有變好」(CV 都是 2.17 cm) ——
# 那是**全域平均**看不出來; 分距離看就很清楚, 邊緣是有差的。
distortion: [-0.006648076226078199, 0.03973089693104473]

# 舊值留著備查 (dx=-2.96 cm, dy=-1.52 cm 的常數偏移 + 0.7% 的尺度誤差都在裡面):
#   - [-5.225384, -0.012379, -0.016942]
#   - [ 0.004277,  5.211111, -0.016666]
#   - [-0.019646, -0.017937,  1.000000]
# 新的 H 靜止段殘差 RMS 0.51 cm, 常數偏移 (-0.12, -0.03) cm —— 原點對準了。
homography:
  - [-5.189600086935195,   -0.004773812242974529,  0.001394323418588948]
  - [ 0.0018066840971339058, 5.18004889553421,    -0.0004644869186598529]
  - [-0.0006686214427134855, 5.354508560874468e-06, 1.0]

# 校正腳本自己報的殘差 (m)。節點拿它當卡爾曼濾波的量測雜訊 R ——
# 「這個模型有多準」該由校正檔說, 不該在節點裡另外猜一個。
#
# *** 這是**單軸** 1-sigma ***, 因為節點是 R = eye(2) * s^2 這樣用的。
# 二維誤差量值的 RMS 是它的 sqrt(2) 倍, 別把兩者搞混:
#   fit_csv 報的 CV RMSE 2.17 cm 是二維的 -> 單軸 2.17/sqrt(2) = 1.53 cm。
# 一致性檢查: 單軸 1.53 cm 預期二維 p95 = 2.45 sigma = 3.75 cm, 實測 3.74 cm。
residual_rms: 0.0153

# delay = **拍照的那一刻比訊息的 header.stamp 早多少秒**。
#
# *** 這是相機端的事, 跟節點處理花多久完全無關。***
# 很多真實相機驅動是「收到影像才蓋時戳」, 那 delay > 0 (曝光 + 傳輸)。
# Isaac 是拍的當下就蓋, 那 delay = 0。不管 YOLO 算 10 ms 還是 200 ms,
# 照片拍的那一刻都沒有變 —— 處理時間**不該**進這裡。
#
# 2026-09-10 用 car_run_data/sim_data.csv 量, 兩個數字放在一起就清楚了:
#   pose 值的年齡 (速度回歸, 完全不用時戳)      51.3 ms
#   影像時戳自己的年齡 (S vs 同列 odom_stamp)  50.0 ms
#                                        差  +1.3 ms   <-- 這才是 delay
# 分五個時段各自算也都在 +0.3 ~ +7.4 ms。也就是說 pose 的舊, 完全就是它
# 時戳說的那麼舊 —— Isaac 沒有標晚, 所以 delay = 0。
#
# *** 這裡曾經填 0.0795, 那是錯的, 別再填回去。***
# 0.0795 來自 car_cam_calib.fit_csv (已刪) 報的 100 ms。但 fit_csv 是把 CSV 裡
# 「最新的 yolo_px」對「當下的真值」去擬合, 它量到的是**像素的總年齡**
# = 影格年齡 + 傳輸 + 推論 + 蒐集節點自己的 staleness。那些全部發生在
# 時戳**之後**, 一項都不屬於 delay。
# 這個錯特別難發現, 因為 delay 只改時戳、不改 pose 值 —— 位置誤差、RMS、
# p95 全部不受影響, 只有依時戳內插的融合節點 (eskf / graph) 受害:
# 時戳提早 80 ms, 3 m/s 時就是拿 24 cm 以外的資料去對齊。
# 節點現在會自己量處理延遲並且在 status 裡比對這兩個數字, 再填錯會直接警告
# (見 camera_loc_node._note_latency)。
#
# 換相機 / 換驅動就要重量。量法: 讓節點印出處理延遲, 再用速度回歸量 pose
# 年齡 (scripts/replay_camera_csv.py 的方法), 兩者相減就是 delay。
#
# 附帶一提: fit_csv 報的那個 delay 還是有用的 —— 它是擬合 H 時用來對齊
# 真值的量, H 與 distortion 就是在那個對齊下擬出來的, 所以 H 不需要跟著改。
# 只是**不要把它抄進這一欄**。
#
# 「位置有多舊」是另一回事, 那個要用 /camera_loc/odom_now (外推到現在)。
delay: 0.0

# 軸對齊 bbox 中心的幾何偏移。YOLO 給的是 AABB, 而車子是有高度的長方體:
# 頂面離相機近、投影大, AABB 中心因此落在頂面與底面投影之間, 偏移量隨 yaw 變。
# 量級 0.5~1 cm。要打開必須先重新擬合單應性 (現在的 H 已經把這一項平均吸收進去了,
# 直接打開等於扣兩次)。
# 2026-09-09: fit_csv 試過 +delay+dist+bbox, CV 沒有比 +delay+distortion 好
# (2.17 vs 2.17 cm), 所以維持關著。
use_aabb: false
aabb:
  h_cam: 2.7             # 相機高度 (m)
  z_ref: 0.10            # 校正平面 = 車身高度
  h_top: 0.20            # 車頂高度
  half_len: 0.21         # 車長的一半
  half_wid: 0.14         # 車寬的一半
  cam_xy: [0.0, 0.0]     # 相機正下方那一點的世界座標
