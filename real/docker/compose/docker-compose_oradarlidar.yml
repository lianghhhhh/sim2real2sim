services:
  oradarlidar:
    image: kros-car-new:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - .env
    devices:
      - "/dev/oradar:/dev/oradar"
    volumes:
      - ./launch:/workspace/launch:ro
    network_mode: host
    ipc: host
    shm_size: 4G
    command: "ros2 launch /workspace/launch/oradarlidar.launch.py"
