scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: range_filter
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.05
        upper_threshold: 8.0
        lower_replacement_value: 100.0
        upper_replacement_value: 100.0

    filter2:
      name: speckle_filter
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 1
        max_range: 8.0
        max_range_difference: 0.3
        filter_window: 2

    filter3:
      name: shadows_filter
      type: laser_filters/ScanShadowsFilter
      params:
        min_angle: 10.0
        max_angle: 170.0
        neighbors: 0
        window: 1
