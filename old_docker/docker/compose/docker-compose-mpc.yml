services:
  mpc_isaac:
    image: ${IMAGE}
    stdin_open: true
    tty: true
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - MPC_CONFIG_PATH=/workspaces/model/mpc_config.json
    network_mode: host
    volumes:
      # 路徑相對於這個 compose 檔 (old_docker/docker/compose/), 往上三層才是 repo 根目錄
      - ../../../src:/workspaces/src
      - ../../../model:/workspaces/model
    command:
      - bash
      - -l
